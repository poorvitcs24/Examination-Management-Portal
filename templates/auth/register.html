{% extends 'base.html' %}{% block title %}{{ role|title }} Registration{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="fw-bold">{{ role|title }} registration</h2>{% if role=='examiner' %}<div class="alert alert-info">Examiner accounts require Admin approval.</div>{% endif %}<form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" required></div><div class="col-md-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department"></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><div class="col-md-6"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" required></div></div><button class="btn btn-primary mt-4 w-100">Create account</button></form></div></div></div></div>{% endblock %}
