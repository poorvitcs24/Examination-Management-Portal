{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="fw-bold">Sign in</h2><p class="text-secondary">Use your EMP account.</p><form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required autofocus><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><hr><div class="small">New student? <a href="{{ url_for('register', role='student') }}">Register</a><br>New examiner? <a href="{{ url_for('register', role='examiner') }}">Register</a></div></div></div></div></div>{% endblock %}
