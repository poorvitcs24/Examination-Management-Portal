{% extends 'base.html' %}{% block title %}Profile{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h2>My Profile</h2><form method="post"><label class="form-label">Username</label><input class="form-control mb-3" value="{{ user.username }}" disabled><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ user.name }}" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{ user.email }}" required><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ user.phone or '' }}"><label class="form-label">Department</label><input class="form-control mb-3" value="{{ user.department or '' }}" disabled><button class="btn btn-primary">Update profile</button></form></div></div></div></div>{% endblock %}
