{% extends 'base.html' %}{% block title %}{{ 'Edit' if course else 'Create' }} Course{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card"><div class="card-body p-4"><h2>{{ 'Edit' if course else 'Create' }} Course</h2><form method="post"><div class="row g-3"><div class="col-md-4"><label class="form-label">Course code</label><input class="form-control" name="course_code" value="{{ course.course_code if course else '' }}" required></div><div class="col-md-8"><label class="form-label">Course name</label><input class="form-control" name="course_name" value="{{ course.course_name if course else '' }}" required></div><div class="col-md-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4">{{ course.description if course else '' }}</textarea></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option {{ 'selected' if not course or course.status=='Active' }}>Active</option><option {{ 'selected' if course and course.status=='Inactive' }}>Inactive</option></select></div></div><div class="mt-4"><button class="btn btn-primary">Save</button> <a class="btn btn-light" href="{{ url_for('admin_courses') }}">Cancel</a></div></form></div></div></div></div>{% endblock %}
