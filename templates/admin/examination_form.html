{% extends 'base.html' %}{% block title %}{{ 'Edit' if examination else 'Create' }} Examination{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-xl-9"><div class="card"><div class="card-body p-4"><h2>{{ 'Edit' if examination else 'Create' }} Examination</h2><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Course</label><select class="form-select" name="course_id" required>{% for c in courses %}<option value="{{ c.id }}" {{ 'selected' if examination and examination.course_id==c.id }}>{{ c.course_code }} · {{ c.course_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Examination name</label><input class="form-control" name="name" value="{{ examination.name if examination else '' }}" required></div><div class="col-md-4"><label class="form-label">Type</label><select class="form-select" name="exam_type"><option>Viva</option><option>Practical</option><option>Project Demo</option><option>Assessment</option></select></div><div class="col-md-4"><label class="form-label">Duration (minutes)</label><input class="form-control" type="number" min="1" name="duration" value="{{ examination.duration if examination else 30 }}" required></div><div class="col-md-4"><label class="form-label">Maximum marks</label><input class="form-control" type="number" min="1" name="max_marks" value="{{ examination.max_marks if examination else 100 }}" required></div><div class="col-md-6"><label class="form-label">Slot creation start</label><input class="form-control" type="datetime-local" name="slot_start" value="{{ examination.slot_start|replace(' ','T') if examination else '' }}" required></div><div class="col-md-6"><label class="form-label">Slot creation end</label><input class="form-control" type="datetime-local" name="slot_end" value="{{ examination.slot_end|replace(' ','T') if examination else '' }}" required></div><div class="col-md-6"><label class="form-label">Booking start</label><input class="form-control" type="datetime-local" name="booking_start" value="{{ examination.booking_start|replace(' ','T') if examination else '' }}" required></div><div class="col-md-6"><label class="form-label">Booking end</label><input class="form-control" type="datetime-local" name="booking_end" value="{{ examination.booking_end|replace(' ','T') if examination else '' }}" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4">{{ examination.description if examination else '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save examination</button> <a class="btn btn-light" href="{{ url_for('admin_examinations') }}">Cancel</a></div></form></div></div></div></div>{% endblock %}
